trigger-respin:
  extends: .shared_config
  stage: trigger-respin
  rules:
    - if: $TRIGGER_RESPIN == "true"
  dependencies:
    - check-downstream
  before_script:
    - source sync_report.env
  script:
    - |
      source "$(dirname "$0")/trigger-respin-render.sh"
      trigger_respin_render "$VERSION"
