copy-to-quay:
  extends: .shared_config
  # see build/dockerfiles/kaniko-ubi9.Dockerfile
  image: quay.io/rhdh/gitlab-runner:kaniko-latest 
  stage: copy-to-quay
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /rhdh-[0-9.]+-rhel-9/
    # for scheduled runs, check env var
    - if: $CI_PIPELINE_SOURCE == "schedule" && $DO_COPY_TO_QUAY == "True"
  script:
    - |
      dnf -y -q install git
      # if sync/ folder updated, then copy to quay with kaniko
      echo "
      =================================
      sync check:
      $sync_check
      ================================="
      sync_check="$(git diff --name-only HEAD~1 sync/ || true; git diff --name-only HEAD~2 sync/ || true)"
      if [[ $CI_PIPELINE_SOURCE == "schedule" ]] || [[ $sync_check != "" ]] || [[ -f outputs1/sync-midstream.sh.diff.txt ]]; then
        echo; git log --graph --pretty=format:'%Cred%h%Creset%C(yellow)%d%Creset :: %s @ %cN <%cE> (%cD - %cr)' --name-only -1; echo
        echo "Copy to quay ..."
        ./build/ci/copy-to-quay.sh || exit 18
        mkdir -p outputs4; touch outputs4/copy-to-quay.sh.result.txt
        if [[ -f /tmp/copy-to-quay.sh.result.txt ]]; then mv /tmp/copy-to-quay.sh.result.txt outputs4/; fi
      else
        mkdir -p outputs4; touch outputs4/copy-to-quay.sh.result.txt
        echo " 
      ======================================================
      [SKIP] Nothing to copy to quay: no new image built!
      ======================================================
      " | tee -a outputs4/copy-to-quay.sh.result.txt
        exit 74
      fi
  artifacts:
    expire_in: 180 minutes
    paths: [outputs4/]