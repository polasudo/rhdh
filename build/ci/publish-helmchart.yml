publish-helmchart:
  extends: .shared_config
  stage: publish-helmchart
  # RHIDP-3698 OSBS builds disabled as we are letting Konflux handle them - https://konflux.apps.stone-prod-p02.hjvn.p1.openshiftapps.com/application-pipeline/workspaces/rhdh/applications/rhdh-1
  # needs: ["copy-to-quay"]
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /rhdh-[0-9.]+-rhel-9/
    # for scheduled runs, check env var
    - if: $CI_PIPELINE_SOURCE == "schedule" && $DO_PUBLISH_HELMCHART == "True"
  script:
    - |
      dnf -y -q install git
      echo "Publish helm chart ..."
      ./build/ci/publish-helmchart.sh -b "$CI_COMMIT_REF_NAME" --debug || exit 19
      mkdir -p outputs5; touch outputs5/publish-helmchart.sh.result.txt
      if [[ -f /tmp/publish-helmchart.sh.result.txt ]]; then mv /tmp/publish-helmchart.sh.result.txt outputs5/; fi
  artifacts:
    expire_in: 8 hours
    paths: [outputs5/]
