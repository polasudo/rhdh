review-stages:
  extends: .shared_config
  stage: review-stages
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      when: never
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /rhdh-[0-9.]+-rhel-9/
    # see https://gitlab.cee.redhat.com/rhidp/rhdh/-/pipeline_schedules/1043/edit
    # for scheduled runs, check env var
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    - |
      dnf -y -q install git findutils
      set +e
      outputfiles=$(find output*/ -name "*.txt")
      NUM_SKIPS=0
      for outputfile in $outputfiles; do 
        echo " ** $outputfile **"
        echo "-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-"
        cat $outputfile
        echo "-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-"
        echo
      done
      if [[ $outputfiles ]]; then
        NUM_SKIPS=$(cat $outputfiles | grep -E "\[SKIP\]| Nothing to" | wc -l)
        echo "[INFO] Total of $NUM_SKIPS stages were skipped."
        # if number of skipped stages > 0, cancel this stage so it's clear something was skipped (eg., we didn't build the hub, only the operator)
        if [[ $NUM_SKIPS -gt 0 ]]; then
          ./build/ci/cancel-pipeline.sh
        fi
      else
        echo "No artifacts from previous stages found!"
        ./build/ci/cancel-pipeline.sh
      fi
