# requires yarn npm prettifier husky
# requires python3-pip npm git jq rsync
# requires yq (python wrapper for jq)
# see also upstream_repos.yml

.shared_config:
  tags:
    - itup-alm-x86
  # for RHDH 1.5+ use yarn3-node22-latest; for 1.4, use yarn3-node20-latest
  image: quay.io/rhdh/gitlab-runner:yarn3-node22-latest
  allow_failure: false
  # see https://gitlab.cee.redhat.com/help/ci/runners/configure_runners.md#configure-runner-behavior-with-variables for what can be set here
  variables:
    # SECURE_FILES_DOWNLOAD_PATH: '.secure_files'
    GIT_DEPTH: "0"
    GIT_FETCH_EXTRA_FLAGS: --prune
    # Resource overrides for ITUP runners (maximized for build operations)
    # Total pod limit: 4 CPUs / 16Gi (includes Helper: 1 CPU / 1Gi)
    KUBERNETES_CPU_REQUEST: "2"        # max: 2
    KUBERNETES_CPU_LIMIT: "3"          # max: 3
    KUBERNETES_MEMORY_REQUEST: "2Gi"   # max: 8Gi
    KUBERNETES_MEMORY_LIMIT: "8Gi"     # max: 15Gi
    KUBERNETES_HELPER_MEMORY_LIMIT: "2Gi"  # max: 2Gi
  artifacts:
    expire_in: 8 hours

workflow:
  rules:
    # RHIDP-11322 skip gitlab sync pipeline and run directly in konflux, 
    # now that [skip ci] and [ci skip] prevent running in BOTH GL and Konflux
    - if: $CI_COMMIT_MESSAGE =~ /.*skip-gitlab.*/
      when: never
    # run if not a merge request or if scheduled
    - if: $CI_PIPELINE_SOURCE != 'merge_request_event' || $CI_PIPELINE_SOURCE == "schedule"

stages:
  - sync-midstream
  - check-downstream
  - trigger-respin
  - weekly-maintenance

include:
  - local: "/build/ci/sync-midstream.yml"
  - local: "/build/ci/weekly-maintenance.yml"
