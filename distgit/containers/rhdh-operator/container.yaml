platforms:
  only:
    - x86_64
compose:
  inherit: false
  pulp_repos: true
  signing_intent: release
image_build_method: imagebuilder
remote_sources:
  - name: upstream1
    remote_source:
      repo: https://gitlab.cee.redhat.com/rhidp/rhdh.git
      ref: b61385af5b07a11d52dcfd1be7f1d182dbe6dfc5
      pkg_managers:
        - gomod
      flags:
        - gomod-vendor-check
      packages:
        gomod:
          - path: distgit/containers/rhdh-operator

