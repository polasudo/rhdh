platforms:
  only:
    - x86_64
compose:
  inherit: false
  pulp_repos: true
  signing_intent: release
image_build_method: imagebuilder
remote_sources:
  - name: upstream1
    remote_source:
      repo: https://gitlab.cee.redhat.com/rhidp/rhdh.git
      ref: 29846b7ba8ae057969ab9f70ed7a2f0797665d4f
      pkg_managers:
        - gomod
      flags:
        - gomod-vendor-check
      packages:
        gomod:
          - path: distgit/containers/rhdh-operator

