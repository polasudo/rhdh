platforms:
  only:
    - x86_64
compose:
  inherit: false
  pulp_repos: true
  signing_intent: release
image_build_method: imagebuilder
remote_sources:
  - name: upstream1
    remote_source:
      repo: https://gitlab.cee.redhat.com/rhidp/rhdh.git
      ref: df3d1e17fe7433a69a088e6fe2c76244ebf26f84
      pkg_managers:
        - gomod
      flags:
        - gomod-vendor-check
      packages:
        gomod:
          - path: distgit/containers/rhdh-operator

