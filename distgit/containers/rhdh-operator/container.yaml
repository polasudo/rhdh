    remote_source:
      repo: https://gitlab.cee.redhat.com/rhidp/rhdh.git
      ref: e8ac5f64c096b7c1313392197d747a313a962654
      pkg_managers:
        - gomod
      flags:
        - gomod-vendor-check
      packages:
        gomod:
          - path: distgit/containers/rhdh-operator

