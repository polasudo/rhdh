    remote_source:
      repo: https://gitlab.cee.redhat.com/rhidp/rhdh.git
      ref: 66b2a856d0c5f08bb69734e842b9bdcdfee48166
      pkg_managers:
        - gomod
      flags:
        - gomod-vendor-check
      packages:
        gomod:
          - path: distgit/containers/rhdh-operator

