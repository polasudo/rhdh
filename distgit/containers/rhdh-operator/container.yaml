      repo: https://gitlab.cee.redhat.com/rhidp/rhdh.git
      ref: 91d5d1d33faea65e38ae2bc6a3d2238c432a0085
      pkg_managers:
        - gomod
      flags:
        - gomod-vendor-check
      packages:
        gomod:
          - path: distgit/containers/rhdh-operator

