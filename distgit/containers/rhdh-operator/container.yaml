    remote_source:
      repo: https://gitlab.cee.redhat.com/rhidp/rhdh.git
      ref: d74d6790d72af417fa3e3a4c64c22dede124b8aa
      pkg_managers:
        - gomod
      flags:
        - gomod-vendor-check
      packages:
        gomod:
          - path: distgit/containers/rhdh-operator

