      repo: https://gitlab.cee.redhat.com/rhidp/rhdh.git
      ref: 6e2d12ac66fd54a31b0e3d2e79168cb270a373e8
      pkg_managers:
        - gomod
      flags:
        - gomod-vendor-check
      packages:
        gomod:
          - path: distgit/containers/rhdh-operator

