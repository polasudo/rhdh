      repo: https://gitlab.cee.redhat.com/rhidp/rhdh.git
      ref: c115145e255f9675ccac5bcd9a6c7908df1a871d
      pkg_managers:
        - gomod
      flags:
        - gomod-vendor-check
      packages:
        gomod:
          - path: distgit/containers/rhdh-operator

