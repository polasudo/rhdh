      repo: https://gitlab.cee.redhat.com/rhidp/rhdh.git
      ref: 22b42cad3eb7e1f169d3753af30ca2c63eec7b9c
      pkg_managers:
        - gomod
      flags:
        - gomod-vendor-check
      packages:
        gomod:
          - path: distgit/containers/rhdh-operator

