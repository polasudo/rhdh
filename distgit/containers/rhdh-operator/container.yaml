platforms:
  only:
    - x86_64
compose:
  inherit: false
  pulp_repos: true
  signing_intent: release
image_build_method: imagebuilder
remote_sources:
  - name: upstream1
    remote_source:
      repo: https://gitlab.cee.redhat.com/rhidp/rhdh.git
      ref: d3f08d7de3a615d775788a9552eb979bc4b594e3
      pkg_managers:
        - gomod
      flags:
        - gomod-vendor-check
      packages:
        gomod:
          - path: distgit/containers/rhdh-operator
