      repo: https://gitlab.cee.redhat.com/rhidp/rhdh.git
      ref: f68802ae8d2fb1c73389641a12b6a93dbb7719fd
      pkg_managers:
        - gomod
      flags:
        - gomod-vendor-check
      packages:
        gomod:
          - path: distgit/containers/rhdh-operator

