      repo: https://gitlab.cee.redhat.com/rhidp/rhdh.git
      ref: d4f82ae9961a59b0edeeab4b742c94c9ed613cdd
      pkg_managers:
        - gomod
      flags:
        - gomod-vendor-check
      packages:
        gomod:
          - path: distgit/containers/rhdh-operator

