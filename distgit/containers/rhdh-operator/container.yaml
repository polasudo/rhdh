    remote_source:
      repo: https://gitlab.cee.redhat.com/rhidp/rhdh.git
      ref: a8ea964106ac618e17e74f8bfb7178c1d34f33cf
      pkg_managers:
        - gomod
      flags:
        - gomod-vendor-check
      packages:
        gomod:
          - path: distgit/containers/rhdh-operator

