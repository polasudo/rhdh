platforms:
  only:
    - x86_64
compose:
  inherit: false
  pulp_repos: true
  signing_intent: release
image_build_method: imagebuilder
remote_sources:
  - name: upstream1
    remote_source:
      repo: https://gitlab.cee.redhat.com/rhidp/rhdh.git
      ref: 52c2b5b0cc20a9615baf5f7ea244f0098adce4f2
      pkg_managers:
        - gomod
      flags:
        - gomod-vendor-check
      packages:
        gomod:
          - path: distgit/containers/rhdh-operator

