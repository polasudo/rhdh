      repo: https://gitlab.cee.redhat.com/rhidp/rhdh.git
      ref: a1aa45b75e830e08ca3bda0b7061fe5787b239c2
      pkg_managers:
        - gomod
      flags:
        - gomod-vendor-check
      packages:
        gomod:
          - path: distgit/containers/rhdh-operator

