    remote_source:
      repo: https://gitlab.cee.redhat.com/rhidp/rhdh.git
      ref: 205d96408713c3a04c2dc75b7ed57a21e58d12e0
      pkg_managers:
        - gomod
      flags:
        - gomod-vendor-check
      packages:
        gomod:
          - path: distgit/containers/rhdh-operator

