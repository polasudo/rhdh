      repo: https://gitlab.cee.redhat.com/rhidp/rhdh.git
      ref: 7a52af2523f1befbc0de31f3ae94c7aa1bc4c5d7
      pkg_managers:
        - gomod
      flags:
        - gomod-vendor-check
      packages:
        gomod:
          - path: distgit/containers/rhdh-operator

