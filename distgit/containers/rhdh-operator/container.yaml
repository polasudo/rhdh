    remote_source:
      repo: https://gitlab.cee.redhat.com/rhidp/rhdh.git
      ref: 75ec5122bdd51b74ee0791f9b90c632e4685cbe6
      pkg_managers:
        - gomod
      flags:
        - gomod-vendor-check
      packages:
        gomod:
          - path: distgit/containers/rhdh-operator

