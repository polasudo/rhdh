    remote_source:
      repo: https://gitlab.cee.redhat.com/rhidp/rhdh.git
      ref: 777b3a77c7b3f21b161d4251c546f5239c68574a
      pkg_managers:
        - gomod
      flags:
        - gomod-vendor-check
      packages:
        gomod:
          - path: distgit/containers/rhdh-operator

