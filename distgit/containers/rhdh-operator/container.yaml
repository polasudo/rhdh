    remote_source:
      repo: https://gitlab.cee.redhat.com/rhidp/rhdh.git
      ref: d6ea1433e8aa0e1391544d7e335b282203791644
      pkg_managers:
        - gomod
      flags:
        - gomod-vendor-check
      packages:
        gomod:
          - path: distgit/containers/rhdh-operator

