    remote_source:
      repo: https://gitlab.cee.redhat.com/rhidp/rhdh.git
      ref: 21254aaddbc9c641b81ef927a0aec30a3e6bc92d
      pkg_managers:
        - gomod
      flags:
        - gomod-vendor-check
      packages:
        gomod:
          - path: distgit/containers/rhdh-operator

