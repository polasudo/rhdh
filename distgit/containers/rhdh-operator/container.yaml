      ref: 5c1a3f8e5cbb9737ffde67a41ac41ff0b1c7e802
      pkg_managers:
        - gomod
      flags:
        - gomod-vendor-check
      packages:
        gomod:
          - path: distgit/containers/rhdh-operator

