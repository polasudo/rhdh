apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: red-hat-developer-hub
  title: Red Hat Developer Hub
  description: |-
    A Red Hat supported version of Backstage, available as container image. Includes pre-built plug-ins, settings, and deployment details, to help streamline setting up a self-managed internal developer portal for new adopters
  links:
    - title: About RHDH
      url: https://developers.redhat.com/rhdh
    - title: RHDH Documentation
      url: https://access.redhat.com/documentation/en-us/red_hat_developer_hub
    - title: RHDH Demo
      url: https://rhdh.janus-idp.io/
    - title: Janus IDP Community Blog
      url: https://janus-idp.io/blog
    - title: Janus IDP Community Slack
      url: https://join.slack.com/t/janus-idp/shared_invite/zt-1pxtehxom-fCFtF9rRe3vFqUiFFeAkmg
  annotations:
    argocd/app-name: 'janus-idp'
    backstage.io/kubernetes-id: 'janus-idp'
    github.com/project-slug: janus-idp/backstage-showcase
    quay.io/repository-slug: janus-idp/backstage-showcase
    backstage.io/techdocs-ref: url:https://github.com/janus-idp/backstage-showcase
    backstage.io/kubernetes-namespace: janus-idp-prod
    sonarqube.org/project-key: janus-idp_backstage-showcase
spec:
  type: website
  system: red-hat-developer-hub
  owner: red-hat
  lifecycle: production
  dependsOn:
    - resource:pgdb
    - resource:argocd
    - resource:obc
    - resource:keycloak
    - resource:github
