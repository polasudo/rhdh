---
# RPM dependencies for the RHDH bootc base image.
# Generate lockfile: rpm-lockfile-prototype --bare rpms.in.yaml --outfile rpms.lock.yaml

moduleEnable:
  - nodejs:22

packages:
  - nodejs
  - npm
  - python3
  - curl
  - sudo
  - podman
  - openssl
  - cloud-init
  - open-vm-tools
  - openssh-server

contentOrigin:
  repofiles:
    - ./rhel-9-baseos.repo
    - ./rhel-9-appstream.repo

context:
  image: registry.redhat.io/rhel9/rhel-bootc@sha256:69ed37a03c95c5461372f0a870b76b5e46265e7ac7b6d7498b9b7a4d546a3e87

arches:
  - x86_64

installWeakDeps: false
