---
# RPM dependencies for the RHDH bootc base image.
# After editing, run (https://github.com/konflux-ci/rpm-lockfile-prototype):
#   rpm-lockfile-prototype -f Containerfile rpms.in.yaml
# to regen rpms.lock.yaml
# Note that the repoid values are special, and must be from here:
# https://github.com/release-engineering/rhtap-ec-policy/blob/main/data/known_rpm_repositories.yml
arches:
  - x86_64

allowerasing: true
contentOrigin:
  repos:
    - repoid: ubi-9-for-$basearch-appstream-rpms
      baseurl: https://cdn-ubi.redhat.com/content/public/ubi/dist/ubi9/9/$basearch/appstream/os/
    - repoid: ubi-9-for-$basearch-appstream-source-rpms
      baseurl: https://cdn-ubi.redhat.com/content/public/ubi/dist/ubi9/9/$basearch/appstream/source/SRPMS
    - repoid: ubi-9-for-$basearch-baseos-rpms
      baseurl: https://cdn-ubi.redhat.com/content/public/ubi/dist/ubi9/9/$basearch/baseos/os/
    - repoid: ubi-9-for-$basearch-baseos-source-rpms
      baseurl: https://cdn-ubi.redhat.com/content/public/ubi/dist/ubi9/9/$basearch/baseos/source/SRPMS
    # RHEL 9 repos (for cloud-init, open-vm-tools, firewalld, audit, openscap-utils, scap-security-guide)
    - repoid: rhel-9-for-$basearch-appstream-rpms
      baseurl: https://rhsm-pulp.corp.redhat.com/content/dist/rhel9/9/$basearch/appstream/os/
    - repoid: rhel-9-for-$basearch-appstream-source-rpms
      baseurl: https://rhsm-pulp.corp.redhat.com/content/dist/rhel9/9/$basearch/appstream/source/SRPMS
    - repoid: rhel-9-for-$basearch-baseos-rpms
      baseurl: https://rhsm-pulp.corp.redhat.com/content/dist/rhel9/9/$basearch/baseos/os/
    - repoid: rhel-9-for-$basearch-baseos-source-rpms
      baseurl: https://rhsm-pulp.corp.redhat.com/content/dist/rhel9/9/$basearch/baseos/source/SRPMS

moduleEnable:
  - nodejs:24

# Only packages NOT already in the rhel-bootc base image.
# Pre-installed: python3, curl, sudo, podman, openssl, openssh-server, crypto-policies-scripts
packages:
  - nodejs
  - npm
  - cloud-init
  - open-vm-tools
  - firewalld
  - audit
  - openscap-utils
  - scap-security-guide

installWeakDeps: false
