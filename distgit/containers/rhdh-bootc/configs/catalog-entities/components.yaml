###############################
# SYSTEMS
###############################
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: rhdh-bootc
  title: RHDH bootc Deployment
  description: |
    Red Hat Developer Hub deployed using RHEL 9 Image Mode with bootc and Podman Quadlet.
    This deployment provides an immutable, atomic-update capable platform for running RHDH
    with air-gap support via logically bound container images.
  tags:
    - developer-hub
    - bootc
    - image-mode
    - quadlet
  links:
    - url: https://red.ht/rhdh
      title: RHDH Homepage
      icon: star
      type: website
    - url: https://developers.redhat.com/blog
      title: Red Hat Developer Blog
      icon: catalog
      type: blog
    - url: https://docs.redhat.com/fr/documentation/red_hat_developer_hub/
      title: RHDH Documentation
      icon: docs
      type: docs
    - url: https://issues.redhat.com/browse/RHIDP
      title: RHDH Jira
      icon: help
      type: jira
    - url: https://bootc.dev/bootc/intro.html
      title: bootc Documentation
      icon: docs
      type: docs
    - url: https://docs.podman.io/en/latest/markdown/podman-quadlet.1.html
      title: Podman Quadlet Documentation
      icon: docs
      type: docs
  annotations:
    backstage.io/techdocs-ref: dir:.
    feedback/type: 'MAIL' # allows for feedback via EMAIL
    feedback/email-to: ${EMAIL_SENDER} # Sets where the EMAIL feedback is to go
    quay.io/repository-slug: rhdh/rhdh-hub-rhel9
spec: 
  owner: user:default/user
  type: product
  lifecycle: production
  profile:
    displayName: RHDH bootc
