# RHDH bootc system entity is defined in catalog-info.yaml at the repository root
# to enable TechDocs with mkdocs.yml and docs/ directory
#
# Components and APIs for the bootc deployment

---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: rhdh-bootc-image
  title: RHDH bootc Container Image
  description: |
    Bootable container image for Red Hat Developer Hub deployment using RHEL 9 Image Mode.
    Includes RHDH, PostgreSQL, and Quadlet systemd integration for air-gap capable deployments.
  tags:
    - bootc
    - rhel-9
    - image-mode
    - podman
    - quadlet
  links:
    - url: https://bootc.dev
      title: bootc Documentation
      icon: docs
    - url: https://docs.podman.io/en/latest/markdown/podman-systemd.unit.5.html
      title: Podman Quadlet
      icon: docs
spec:
  type: image
  lifecycle: experimental
  owner: group:default/rhdh-team
  system: rhdh-bootc
  # providesApis:
  #   - rhdh-api

