# Catalog users/groups placeholder
# This base image does not ship default user or group entities.
# Downstream consumers should add their own users and groups here,
# or configure an external identity provider (e.g. LDAP, GitHub, OIDC).
#
# Example:
# ---
# apiVersion: backstage.io/v1alpha1
# kind: Group
# metadata:
#   name: my-team
#   title: My Team
# spec:
#   type: team
#   children: []
#
# ---
# apiVersion: backstage.io/v1alpha1
# kind: User
# metadata:
#   name: admin
# spec:
#   memberOf: [my-team]
