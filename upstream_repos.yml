repos:
  - repo: https://github.com/redhat-developer/rhdh
    branch:
      # list branch to fetch; if first not found, try second as fallback
      - main
    # include the contents of the repo's root folder too?
    include_root: true
    # list of files/folders to exclude from upstream in this repo
    exclude_root:
      - .git/
      - .github/
      - .husky/
      - .ibm/
      - build/ci/
      - build/helm/
      - build/scripts/
      - e2e-test/
      - packages/app/.webpack-cache/
      - README.adoc
      - sync/
      - upstream_repos.yaml
      # RHIDP-10871 - as of 1.10 exclude this file from the RHDH container; it now ONLY lives in the index container
      - dynamic-plugins.default.yaml
    destination_folder: distgit/containers/rhdh-hub/

  - repo: https://github.com/redhat-developer/rhdh-operator
    branch: 
      # list branch to fetch; if first not found, try second as fallback
      - main
    include_root: true
    # list of files/folders to exclude from upstream in this repo
    exclude_root:
      - .git/
      - .github/
      - .husky/
      - build/ci/
      - build/helm/
      - build/scripts/
      - bundle/tests/scorecard/
      - README.adoc
      - sync/
      - upstream_repos.yaml
    destination_folder: distgit/containers/rhdh-operator/
    # note special rule in sync-midstream.sh will also copy the contents of bundle/ into distgit/containers/rhdh-operator-bundle/
    # and docker/brew.bundle.Dockerfile to distgit/containers/rhdh-operator-bundle/Dockerfile.in

  - repo: https://github.com/redhat-developer/rhdh-must-gather
    branch:
      - main
    include_root: true
    # only collection-scripts/, Containerfile, and LICENSE are needed for the image build
    exclude_root:
      - .git/
      - .github/
      - .gitleaks.toml
      - CLAUDE.md
      - CONTRIBUTING.md
      - docs/
      - hack/
      - Makefile
      - pr_agent.toml
      - README.md
      - tests/
    destination_folder: distgit/containers/rhdh-must-gather/
  
  - repo: https://github.com/redhat-ai-dev/rhdh-rag-content
    branch:
      - main
    include_root: true
    exclude_root:
      - .git/
      - .github/
      - .ci/
      - build/ci/
      - build/helm/
      - build/scripts/
      - README.adoc
      - sync/
      - upstream_repos.yaml
      - renovate.json
      - tests/
      - Makefile # used for local only
      - Containerfile.local
    destination_folder: distgit/containers/rhdh-rag-content
