apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://gitlab.cee.redhat.com/rhidp/rhdh/-/tree/{{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/pull_request_number: '{{pull_request_number}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/max-keep-runs: "7"
    # Trigger rebuild v4 - main branch EC verification.
    pipelinesascode.tekton.dev/on-cel-expression: |
      (event == "push" || event == "pull_request") && 
      target_branch == "rhdh-1-rhel-9" && 
      ( "distgit/containers/rhdh-operator/***".pathChanged() || ".tekton/rhdh-operator-1.yaml".pathChanged() )
  creationTimestamp: null
  labels:
    appstudio.openshift.io/application: rhdh-1
    appstudio.openshift.io/component: rhdh-operator-1
    pipelines.appstudio.openshift.io/type: build
  name: rhdh-operator-1
  namespace: rhdh-tenant
spec:
  params:
    # Component identification
    - name: rhdh-version
      value: "1"
    - name: component-type
      value: operator
    - name: DO_HELM
      value: "false"
    - name: IS_BUNDLE
      value: "false"
    - name: skip-checks
      value: "false"
    - name: hermetic
      value: "true"

    - name: build-source-image
      value: "true"
    - name: build-image-index
      value: "true"
    - name: build-args
      value: []
    - name: build-args-file
      value: ""
    # Common build parameters
    - name: git-url
      value: '{{source_url}}'
    - name: revision
      value: '{{revision}}'
    - name: source-branch
      value: '{{source_branch}}'
    - name: target_branch
      value: '{{target_branch}}'
    - name: event-type
      value: '{{event}}'
    - name: output-image
      value: quay.io/rhdh/rhdh-rhel9-operator:{{revision}}
    - name: image-expires-after
      value: ''
    - name: dockerfile
      value: Containerfile
    - name: path-context
      value: distgit/containers/rhdh-operator
    - name: prefetch-input
      value: '{"packages": [{"type": "rpm", "path": "distgit/containers/rhdh-operator"},{"path": "distgit/containers/rhdh-operator", "type": "gomod"}], "flags": ["cgo-disable"]}'
  pipelineRef:
    name: build-pipeline-rhdh
  taskRunSpecs:
    - pipelineTaskName: build-container-operator
      stepSpecs:
      - name: build
        computeResources:
          requests:
            cpu: '8'
            memory: 20Gi
          limits:
            cpu: '8'
            memory: 20Gi
    - pipelineTaskName: prefetch-dependencies-operator
      computeResources:
        requests:
          cpu: '8'
          memory: 16Gi
        limits:
          cpu: '8'
          memory: 16Gi
  taskRunTemplate:
    serviceAccountName: build-pipeline-rhdh-operator-1
  timeouts:
    pipeline: 3h
  workspaces:
  - name: workspace
    volumeClaimTemplate:
      metadata:
        creationTimestamp: null
      spec:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
      status: {}
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'
status: {}

