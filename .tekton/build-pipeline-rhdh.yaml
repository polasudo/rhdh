apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: build-pipeline-rhdh
spec:
  finally:
    - name: show-sbom-bundle
      params:
        - name: IMAGE_URL
          value: "$(tasks.build-image-index-bundle.results.IMAGE_URL)"
      taskRef:
        params:
          - name: name
            value: show-sbom
          - name: bundle
            value: quay.io/konflux-ci/tekton-catalog/task-show-sbom:0.1@sha256:04994df487ee886adbe60a8a5866647fbdfd53cc26f7b2554272ba51bf7af29e
          - name: kind
            value: task
        resolver: bundles
      when:
        - input: $(params.component-type)
          operator: in
          values: ["operator-bundle"]
    - name: show-summary-bundle
      params:
        - name: pipelinerun-name
          value: $(context.pipelineRun.name)
        - name: git-url
          value: "$(tasks.clone-repository-bundle.results.url)?rev=$(tasks.clone-repository-bundle.results.commit)"
        - name: image-url
          value: $(params.output-image)
      taskRef:
        params:
          - name: name
            value: summary
          - name: bundle
            value: quay.io/konflux-ci/tekton-catalog/task-summary:0.2@sha256:526555c9d77ca9e97c52ee6bfcd097fbedc1f3442084367c936af4faa69951e8
          - name: kind
            value: task
        resolver: bundles
      when:
        - input: $(params.component-type)
          operator: in
          values: ["operator-bundle"]
      workspaces:
        - name: workspace
          workspace: workspace
    - name: show-sbom-hub
      params:
        - name: IMAGE_URL
          value: "$(tasks.build-image-index-hub.results.IMAGE_URL)"
      taskRef:
        params:
          - name: name
            value: show-sbom
          - name: bundle
            value: quay.io/konflux-ci/tekton-catalog/task-show-sbom:0.1@sha256:04994df487ee886adbe60a8a5866647fbdfd53cc26f7b2554272ba51bf7af29e
          - name: kind
            value: task
        resolver: bundles
      when:
        - input: $(params.component-type)
          operator: in
          values: ["hub"]
    - name: show-summary-hub
      params:
        - name: pipelinerun-name
          value: $(context.pipelineRun.name)
        - name: git-url
          value: $(tasks.clone-repository-hub.results.url)?rev=$(tasks.clone-repository-hub.results.commit)
        - name: image-url
          value: quay.io/rhdh/rhdh-hub-rhel9:$(params.revision)
      taskRef:
        params:
          - name: name
            value: summary
          - name: bundle
            value: quay.io/konflux-ci/tekton-catalog/task-summary:0.2@sha256:526555c9d77ca9e97c52ee6bfcd097fbedc1f3442084367c936af4faa69951e8
          - name: kind
            value: task
        resolver: bundles
      when:
        - input: $(params.component-type)
          operator: in
          values: ["hub"]
      workspaces:
        - name: workspace
          workspace: workspace
    - name: show-sbom-operator
      params:
        - name: IMAGE_URL
          value: "$(tasks.build-image-index-operator.results.IMAGE_URL)"
      taskRef:
        params:
          - name: name
            value: show-sbom
          - name: bundle
            value: quay.io/konflux-ci/tekton-catalog/task-show-sbom:0.1@sha256:04994df487ee886adbe60a8a5866647fbdfd53cc26f7b2554272ba51bf7af29e
          - name: kind
            value: task
        resolver: bundles
      when:
        - input: $(params.component-type)
          operator: in
          values: ["operator"]
    - name: show-summary-operator
      params:
        - name: pipelinerun-name
          value: $(context.pipelineRun.name)
        - name: git-url
          value: $(tasks.clone-repository-operator.results.url)?rev=$(tasks.clone-repository-operator.results.commit)
        - name: image-url
          value: quay.io/rhdh/rhdh-rhel9-operator:$(params.revision)
      taskRef:
        params:
          - name: name
            value: summary
          - name: bundle
            value: quay.io/konflux-ci/tekton-catalog/task-summary:0.2@sha256:526555c9d77ca9e97c52ee6bfcd097fbedc1f3442084367c936af4faa69951e8
          - name: kind
            value: task
        resolver: bundles
      when:
        - input: $(params.component-type)
          operator: in
          values: ["operator"]
      workspaces:
        - name: workspace
          workspace: workspace
  params:
    # Version parameter
    - description: RHDH version (e.g., 1, 1-7)
      name: rhdh-version
      type: string
      default: "1"
    # Component selector parameter
    - description: Component type (hub, operator, operator-bundle)
      name: component-type
      type: string
    # Conditional flags
    - description: Enable Helm publishing (hub only)
      name: DO_HELM
      type: string
      default: "false"
    - description: Is this an operator bundle build
      name: IS_BUNDLE
      type: string
      default: "false"
    # Common parameters
    - description: Source Repository URL
      name: git-url
      type: string
    - default: ""
      description: Revision of the Source Repository
      name: revision
      type: string
    - default: ""
      description: The Target branch to be published onto
      name: target_branch
      type: string
    - default: ""
      description: Source branch name (e.g. PR head)
      name: source-branch
      type: string
    - description: Fully Qualified Output Image
      name: output-image
      type: string
    - default: .
      description: Path to the source code of an application's component from where to build image.
      name: path-context
      type: string
    - default: Containerfile
      description: Path to the Dockerfile inside the context specified by parameter path-context
      name: dockerfile
      type: string
    - default: "false"
      description: Skip checks against built image
      name: skip-checks
      type: string
    - default: "true"
      description: Execute the build with network isolation (false for operator-bundle)
      name: hermetic
      type: string
    - default: ""
      description: Build dependencies to be prefetched by Cachi2
      name: prefetch-input
      type: string
    - default: ""
      description: Image tag expiration time
      name: image-expires-after
      type: string
    - default: "true"
      description: Build a source image.
      name: build-source-image
      type: string
    - default: "true"
      description: Add built image into an OCI image index (false for operator-bundle)
      name: build-image-index
      type: string
    - default: []
      description: Array of --build-arg values for buildah
      name: build-args
      type: array
    - default: ""
      description: Path to a file with build arguments for buildah
      name: build-args-file
      type: string
  results:
    - description: "The fully qualified URL of the built container image (concatenation of hub/operator and bundle results, one will be empty)"
      name: IMAGE_URL
      value: "$(tasks.build-image-index-hub.results.IMAGE_URL)$(tasks.build-image-index-operator.results.IMAGE_URL)$(tasks.build-image-index-bundle.results.IMAGE_URL)"
    - description: "The SHA256 digest of the built container image (concatenation of hub, operator and bundle results, whichever didn't run will be empty)"
      name: IMAGE_DIGEST
      value: "$(tasks.build-image-index-hub.results.IMAGE_DIGEST)$(tasks.build-image-index-operator.results.IMAGE_DIGEST)$(tasks.build-image-index-bundle.results.IMAGE_DIGEST)"
    - description: "The Git repository URL used for this build (concatenation, whichever didn't run will be empty)"
      name: CHAINS-GIT_URL
      value: "$(tasks.clone-repository-hub.results.url)$(tasks.clone-repository-operator.results.url)$(tasks.clone-repository-bundle.results.url)"
    - description: "The Git commit SHA used for this build (concatenation, whichever didn't run will be empty)"
      name: CHAINS-GIT_COMMIT
      value: "$(tasks.clone-repository-hub.results.commit)$(tasks.clone-repository-operator.results.commit)$(tasks.clone-repository-bundle.results.commit)"
  tasks:
    - name: init
      taskRef:
        params:
          - name: name
            value: init
          - name: bundle
            value: quay.io/konflux-ci/tekton-catalog/task-init:0.4@sha256:288f3106118edc1d0f0c79a89c960abf5841a4dd8bc3f38feb10527253105b19
          - name: kind
            value: task
        resolver: bundles
    # ============================================================================
    # PARALLEL HUB BUILD CHAIN - Runs when hub-changed == "true"
    # ============================================================================
    - name: clone-repository-hub
      params:
        - name: url
          value: $(params.git-url)
        - name: revision
          value: $(params.revision)
        - name: ociStorage
          value: quay.io/rhdh/rhdh-hub-rhel9:$(params.revision).git
        - name: ociArtifactExpiresAfter
          value: $(params.image-expires-after)
      runAfter:
        - init
      taskRef:
        params:
          - name: name
            value: git-clone-oci-ta
          - name: bundle
            value: quay.io/konflux-ci/tekton-catalog/task-git-clone-oci-ta:0.1@sha256:2c388d28651457db60bb90287e7d8c3680303197196e4476878d98d81e8b6dc9
          - name: kind
            value: task
        resolver: bundles
      retries: 2
      timeout: 10m
      when:
        - input: $(params.component-type)
          operator: in
          values: ["hub"]
      workspaces:
        - name: basic-auth
          workspace: git-auth

    # ============================================================================
    # PARALLEL OPERATOR BUILD CHAIN - Runs when operator-changed == "true"
    # ============================================================================
    - name: clone-repository-operator
      params:
        - name: url
          value: $(params.git-url)
        - name: revision
          value: $(params.revision)
        - name: ociStorage
          value: quay.io/rhdh/rhdh-rhel9-operator:$(params.revision).git
        - name: ociArtifactExpiresAfter
          value: $(params.image-expires-after)
      runAfter:
        - init
      taskRef:
        params:
          - name: name
            value: git-clone-oci-ta
          - name: bundle
            value: quay.io/konflux-ci/tekton-catalog/task-git-clone-oci-ta:0.1@sha256:2c388d28651457db60bb90287e7d8c3680303197196e4476878d98d81e8b6dc9
          - name: kind
            value: task
        resolver: bundles
      retries: 2
      timeout: 10m
      when:
        - input: $(params.component-type)
          operator: in
          values: ["operator"]
      workspaces:
        - name: basic-auth
          workspace: git-auth

    # ============================================================================
    # PREFETCH TASKS FOR PARALLEL BUILDS
    # ============================================================================
    - name: prefetch-dependencies-hub
      params:
        - name: config-file-content
          value: |
            ---
            requests_timeout: 600000
            subprocess_timeout: 7200
        - name: log-level
          value: debug
        - name: input
          value: '[{"type": "rpm", "path": "distgit/containers/rhdh-hub"},{"type": "yarn","path": "distgit/containers/rhdh-hub"},{"type": "yarn","path": "distgit/containers/rhdh-hub/dynamic-plugins"},{"type": "pip","path": "distgit/containers/rhdh-hub/python", "allow_binary": "false"}]'
        - name: SOURCE_ARTIFACT
          value: $(tasks.clone-repository-hub.results.SOURCE_ARTIFACT)
        - name: ociStorage
          value: quay.io/rhdh/rhdh-hub-rhel9:$(params.revision).prefetch
        - name: ociArtifactExpiresAfter
          value: $(params.image-expires-after)
      runAfter:
        - clone-repository-hub
      taskRef:
        params:
          - name: name
            value: prefetch-dependencies-oci-ta
          - name: bundle
            value: quay.io/konflux-ci/tekton-catalog/task-prefetch-dependencies-oci-ta:0.3@sha256:2229dbc5e15acc0a6d8aec526465aeb0ad54e269c311ac3d0aba88013845e308
          - name: kind
            value: task
        resolver: bundles
      when:
        - input: $(params.component-type)
          operator: in
          values: ["hub"]
      workspaces:
        - name: git-basic-auth
          workspace: git-auth
        - name: netrc
          workspace: netrc

    - name: prefetch-dependencies-operator
      params:
        - name: config-file-content
          value: |
            ---
            requests_timeout: 600000
            subprocess_timeout: 7200
        - name: log-level
          value: debug
        - name: input
          value: '{"packages": [{"type": "rpm", "path": "distgit/containers/rhdh-operator"},{"path": "distgit/containers/rhdh-operator", "type": "gomod"}], "flags": ["cgo-disable"]}'
        - name: SOURCE_ARTIFACT
          value: $(tasks.clone-repository-operator.results.SOURCE_ARTIFACT)
        - name: ociStorage
          value: quay.io/rhdh/rhdh-rhel9-operator:$(params.revision).prefetch
        - name: ociArtifactExpiresAfter
          value: $(params.image-expires-after)
      runAfter:
        - clone-repository-operator
      taskRef:
        params:
          - name: name
            value: prefetch-dependencies-oci-ta
          - name: bundle
            value: quay.io/konflux-ci/tekton-catalog/task-prefetch-dependencies-oci-ta:0.3@sha256:2229dbc5e15acc0a6d8aec526465aeb0ad54e269c311ac3d0aba88013845e308
          - name: kind
            value: task
        resolver: bundles
      when:
        - input: $(params.component-type)
          operator: in
          values: ["operator"]
      workspaces:
        - name: git-basic-auth
          workspace: git-auth
        - name: netrc
          workspace: netrc

    # Git clone task for operator-bundle (standard version)
    - name: clone-repository-bundle
      params:
        - name: url
          value: $(params.git-url)
        - name: revision
          value: $(params.revision)
      runAfter:
        - init
      taskRef:
        params:
          - name: name
            value: git-clone
          - name: bundle
            value: quay.io/konflux-ci/tekton-catalog/task-git-clone:0.1@sha256:7db7ad9653dccc771407cb0294487cf4be9064fa782ffad7e983db1a8ba57e21
          - name: kind
            value: task
        resolver: bundles
      when:
        - input: $(params.component-type)
          operator: in
          values: ["operator-bundle"]
      workspaces:
        - name: output
          workspace: workspace
        - name: basic-auth
          workspace: git-auth
    # Prefetch dependencies task for operator-bundle (standard version)
    # This task is conditionally skipped for operator-bundle (prefetch-input is empty)
    # because operator-bundle images are just text/manifests in a scratch image with no dependencies.
    # EC policy exception required: tasks.required_tasks_found:prefetch-dependencies
    # Tracking: RHIDP-5318
    - name: prefetch-dependencies-bundle
      params:
        - name: input
          value: $(params.prefetch-input)
      runAfter:
        - clone-repository-bundle
      taskRef:
        params:
          - name: name
            value: prefetch-dependencies
          - name: bundle
            value: quay.io/konflux-ci/tekton-catalog/task-prefetch-dependencies:0.3@sha256:45d2d88ddcc02db4605a4059e034121163458a63b7bb4e179e4402c156f84487
          - name: kind
            value: task
        resolver: bundles
      when:
        - input: $(params.prefetch-input)
          operator: notin
          values: [""]
        - input: $(params.component-type)
          operator: in
          values: ["operator-bundle"]
      workspaces:
        - name: source
          workspace: workspace
        - name: git-basic-auth
          workspace: git-auth
        - name: netrc
          workspace: netrc

    # ============================================================================
    # BUILD CONTAINER TASKS FOR PARALLEL BUILDS
    # ============================================================================
    - name: build-container-hub
      params:
        - name: IMAGE
          value: quay.io/rhdh/rhdh-hub-rhel9:$(params.revision)
        - name: DOCKERFILE
          value: $(params.dockerfile)
        - name: CONTEXT
          value: distgit/containers/rhdh-hub
        - name: HERMETIC
          value: $(params.hermetic)
        - name: PREFETCH_INPUT
          value: '[{"type": "rpm", "path": "distgit/containers/rhdh-hub"},{"type": "yarn","path": "distgit/containers/rhdh-hub"},{"type": "yarn","path": "distgit/containers/rhdh-hub/dynamic-plugins"},{"type": "pip","path": "distgit/containers/rhdh-hub/python", "allow_binary": "false"}]'
        - name: IMAGE_EXPIRES_AFTER
          value: $(params.image-expires-after)
        - name: COMMIT_SHA
          value: $(tasks.clone-repository-hub.results.commit)
        - name: BUILD_ARGS
          value:
            - $(params.build-args[*])
        - name: BUILD_ARGS_FILE
          value: $(params.build-args-file)
        - name: SOURCE_ARTIFACT
          value: $(tasks.prefetch-dependencies-hub.results.SOURCE_ARTIFACT)
        - name: CACHI2_ARTIFACT
          value: $(tasks.prefetch-dependencies-hub.results.CACHI2_ARTIFACT)
        - name: SBOM_TYPE
          value: spdx
      # explicitly set to false to improve performance (ISV-6444)
        - name: CONTEXTUALIZE_SBOM
          value: false
      runAfter:
        - prefetch-dependencies-hub
      taskRef:
        params:
          - name: name
            value: buildah-oci-ta
          - name: bundle
            value: quay.io/konflux-ci/tekton-catalog/task-buildah-oci-ta:0.9@sha256:5375e5b9f5efdb8b27ed981da7d481027a184047138232937992a7027c8bca93
          - name: kind
            value: task
        resolver: bundles
      retries: 1
      timeout: 2h
      when:
        - input: $(params.component-type)
          operator: in
          values: ["hub"]

    - name: build-container-operator
      params:
        - name: IMAGE
          value: quay.io/rhdh/rhdh-rhel9-operator:$(params.revision)
        - name: DOCKERFILE
          value: $(params.dockerfile)
        - name: CONTEXT
          value: distgit/containers/rhdh-operator
        - name: HERMETIC
          value: $(params.hermetic)
        - name: PREFETCH_INPUT
          value: '{"packages": [{"type": "rpm", "path": "distgit/containers/rhdh-operator"},{"path": "distgit/containers/rhdh-operator", "type": "gomod"}], "flags": ["cgo-disable"]}'
        - name: IMAGE_EXPIRES_AFTER
          value: $(params.image-expires-after)
        - name: COMMIT_SHA
          value: $(tasks.clone-repository-operator.results.commit)
        - name: BUILD_ARGS
          value:
            - $(params.build-args[*])
        - name: BUILD_ARGS_FILE
          value: $(params.build-args-file)
        - name: SOURCE_ARTIFACT
          value: $(tasks.prefetch-dependencies-operator.results.SOURCE_ARTIFACT)
        - name: CACHI2_ARTIFACT
          value: $(tasks.prefetch-dependencies-operator.results.CACHI2_ARTIFACT)
        - name: SBOM_TYPE
          value: spdx
      # explicitly set to false to improve performance (ISV-6444)
        - name: CONTEXTUALIZE_SBOM
          value: false
      runAfter:
        - prefetch-dependencies-operator
      taskRef:
        params:
          - name: name
            value: buildah-oci-ta
          - name: bundle
            value: quay.io/konflux-ci/tekton-catalog/task-buildah-oci-ta:0.9@sha256:5375e5b9f5efdb8b27ed981da7d481027a184047138232937992a7027c8bca93
          - name: kind
            value: task
        resolver: bundles
      retries: 1
      timeout: 2h
      when:
        - input: $(params.component-type)
          operator: in
          values: ["operator"]

    # Main build container task for operator-bundle
    - name: build-container-bundle
      params:
        - name: IMAGE
          value: $(params.output-image)
        - name: DOCKERFILE
          value: $(params.dockerfile)
        - name: CONTEXT
          value: $(params.path-context)
        - name: HERMETIC
          value: $(params.hermetic)
        - name: PREFETCH_INPUT
          value: $(params.prefetch-input)
        - name: IMAGE_EXPIRES_AFTER
          value: $(params.image-expires-after)
        - name: COMMIT_SHA
          value: $(tasks.clone-repository-bundle.results.commit)
        - name: BUILD_ARGS
          value:
            - $(params.build-args[*])
        - name: BUILD_ARGS_FILE
          value: $(params.build-args-file)
      runAfter:
        - clone-repository-bundle
      taskRef:
        params:
          - name: name
            value: buildah
          - name: bundle
            value: quay.io/konflux-ci/tekton-catalog/task-buildah:0.9@sha256:4a026f5420455ea08c1a7143cfe0451c5460b1ffebf7f85025d833b1919bb54d
          - name: kind
            value: task
        resolver: bundles
      when:
        - input: $(params.component-type)
          operator: in
          values: ["operator-bundle"]
      workspaces:
        - name: source
          workspace: workspace
    # Build image index task for hub
    - name: build-image-index-hub
      params:
        - name: IMAGE
          value: quay.io/rhdh/rhdh-hub-rhel9:$(params.revision)
        - name: COMMIT_SHA
          value: $(tasks.clone-repository-hub.results.commit)
        - name: IMAGE_EXPIRES_AFTER
          value: $(params.image-expires-after)
        - name: ALWAYS_BUILD_INDEX
          value: $(params.build-image-index)
        - name: IMAGES
          value:
            - $(tasks.build-container-hub.results.IMAGE_URL)@$(tasks.build-container-hub.results.IMAGE_DIGEST)
      runAfter:
        - build-container-hub
      taskRef:
        params:
          - name: name
            value: build-image-index
          - name: bundle
            value: quay.io/konflux-ci/tekton-catalog/task-build-image-index:0.3@sha256:ae3fa44f005054d4901d33413972227b5642d376968a67791535cdcc2e98473d
          - name: kind
            value: task
        resolver: bundles
      when:
        - input: $(params.component-type)
          operator: in
          values: ["hub"]
    # Build image index task for operator
    - name: build-image-index-operator
      params:
        - name: IMAGE
          value: quay.io/rhdh/rhdh-rhel9-operator:$(params.revision)
        - name: COMMIT_SHA
          value: $(tasks.clone-repository-operator.results.commit)
        - name: IMAGE_EXPIRES_AFTER
          value: $(params.image-expires-after)
        - name: ALWAYS_BUILD_INDEX
          value: $(params.build-image-index)
        - name: IMAGES
          value:
            - $(tasks.build-container-operator.results.IMAGE_URL)@$(tasks.build-container-operator.results.IMAGE_DIGEST)
      runAfter:
        - build-container-operator
      taskRef:
        params:
          - name: name
            value: build-image-index
          - name: bundle
            value: quay.io/konflux-ci/tekton-catalog/task-build-image-index:0.3@sha256:ae3fa44f005054d4901d33413972227b5642d376968a67791535cdcc2e98473d
          - name: kind
            value: task
        resolver: bundles
      when:
        - input: $(params.component-type)
          operator: in
          values: ["operator"]
    # Build image index task for operator-bundle
    - name: build-image-index-bundle
      params:
        - name: IMAGE
          value: $(params.output-image)
        - name: COMMIT_SHA
          value: $(tasks.clone-repository-bundle.results.commit)
        - name: IMAGE_EXPIRES_AFTER
          value: $(params.image-expires-after)
        - name: ALWAYS_BUILD_INDEX
          value: $(params.build-image-index)
        - name: IMAGES
          value:
            - $(tasks.build-container-bundle.results.IMAGE_URL)@$(tasks.build-container-bundle.results.IMAGE_DIGEST)
      runAfter:
        - build-container-bundle
      taskRef:
        params:
          - name: name
            value: build-image-index
          - name: bundle
            value: quay.io/konflux-ci/tekton-catalog/task-build-image-index:0.3@sha256:ae3fa44f005054d4901d33413972227b5642d376968a67791535cdcc2e98473d
          - name: kind
            value: task
        resolver: bundles
      when:
        - input: $(params.component-type)
          operator: in
          values: ["operator-bundle"]
    # Build source image task for hub
    - name: build-source-image-hub
      params:
        - name: BINARY_IMAGE
          value: "$(tasks.build-image-index-hub.results.IMAGE_URL)"
        - name: BINARY_IMAGE_DIGEST
          value: "$(tasks.build-image-index-hub.results.IMAGE_DIGEST)"
        - name: SOURCE_ARTIFACT
          value: $(tasks.prefetch-dependencies-hub.results.SOURCE_ARTIFACT)
        - name: CACHI2_ARTIFACT
          value: $(tasks.prefetch-dependencies-hub.results.CACHI2_ARTIFACT)
      runAfter:
        - build-image-index-hub
