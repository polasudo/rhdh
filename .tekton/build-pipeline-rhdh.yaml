apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: build-pipeline-rhdh
spec:
  finally:
    - name: show-sbom
      params:
        - name: IMAGE_URL
          value: "$(tasks.build-image-index.results.IMAGE_URL)$(tasks.build-image-index-bundle.results.IMAGE_URL)"
      taskRef:
        params:
          - name: name
            value: show-sbom
          - name: bundle
            value: quay.io/konflux-ci/tekton-catalog/task-show-sbom:0.1@sha256:beb0616db051952b4b861dd8c3e00fa1c0eccbd926feddf71194d3bb3ace9ce7
          - name: kind
            value: task
        resolver: bundles
      when:
        - input: $(tasks.init.results.build)
          operator: in
          values: ["true"]
    - name: show-summary
      params:
        - name: pipelinerun-name
          value: $(context.pipelineRun.name)
        - name: git-url
          value: "$(tasks.clone-repository.results.url)?rev=$(tasks.clone-repository.results.commit)$(tasks.clone-repository-bundle.results.url)?rev=$(tasks.clone-repository-bundle.results.commit)"
        - name: image-url
          value: $(params.output-image)
        - name: build-task-status
          value: "$(tasks.build-image-index.status)$(tasks.build-image-index-bundle.status)"
      taskRef:
        params:
          - name: name
            value: summary
          - name: bundle
            value: quay.io/konflux-ci/tekton-catalog/task-summary:0.2@sha256:3f6e8513cbd70f0416eb6c6f2766973a754778526125ff33d8e3633def917091
          - name: kind
            value: task
        resolver: bundles
      when:
        - input: $(tasks.init.results.build)
          operator: in
          values: ["true"]
        - input: $(params.component-type)
          operator: in
          values: ["hub", "operator-bundle"]  # Only hub and operator-bundle have summary
      workspaces:
        - name: workspace
          workspace: workspace
  params:
    # Version parameter
    - description: RHDH version (e.g., 1, 1-7)
      name: rhdh-version
      type: string
      default: "1"
    # Component selector parameter
    - description: Component type (hub, operator, operator-bundle)
      name: component-type
      type: string
    # Conditional flags
    - description: Enable Helm publishing (hub only)
      name: DO_HELM
      type: string
      default: "false"
    - description: Is this an operator bundle build
      name: IS_BUNDLE
      type: string
      default: "false"
    # Common parameters
    - description: Source Repository URL
      name: git-url
      type: string
    - default: ""
      description: Revision of the Source Repository
      name: revision
      type: string
    - default: ""
      description: The Target branch to be published onto
      name: target_branch
      type: string
    - default: ""
      description: Source branch name (e.g. PR head)
      name: source-branch
      type: string
    - description: Fully Qualified Output Image
      name: output-image
      type: string
    - description: Private output image reference used for Sealights artifacts
      name: sealights-output-image
      type: string
    - default: "Containerfile.sealights"
      description: If you have a dedicated Dockerfile for Sealights instrumented image
      name: sealights-dockerfile
      type: string
    - default: "false"
      description: Enable Sealights instrumentation build
      name: enable-sealights
      type: string
    - default: .
      description: Path to the source code of an application's component from where to build image.
      name: path-context
      type: string
    - default: Containerfile
      description: Path to the Dockerfile inside the context specified by parameter path-context
      name: dockerfile
      type: string
    - default: "false"
      description: Force rebuild image
      name: rebuild
      type: string
    - default: "false"
      description: Skip checks against built image
      name: skip-checks
      type: string
    - default: "true"
      description: Execute the build with network isolation (false for operator-bundle)
      name: hermetic
      type: string
    - default: ""
      description: Build dependencies to be prefetched by Cachi2
      name: prefetch-input
      type: string
    - default: ""
      description: Image tag expiration time
      name: image-expires-after
      type: string
    - default: ""
      description: Sealights image tag expiration time
      name: sealights-image-expires-after
      type: string
    - default: "true"
      description: Build a source image.
      name: build-source-image
      type: string
    - default: "true"
      description: Add built image into an OCI image index (false for operator-bundle)
      name: build-image-index
      type: string
    - default: []
      description: Array of --build-arg values for buildah
      name: build-args
      type: array
    - default: ""
      description: Path to a file with build arguments for buildah
      name: build-args-file
      type: string
  results:
    - description: "The fully qualified URL of the built container image"
      name: IMAGE_URL
      value: "$(tasks.build-image-index.results.IMAGE_URL)$(tasks.build-image-index-bundle.results.IMAGE_URL)"
    - description: "The SHA256 digest of the built container image"
      name: IMAGE_DIGEST
      value: "$(tasks.build-image-index.results.IMAGE_DIGEST)$(tasks.build-image-index-bundle.results.IMAGE_DIGEST)"
    - description: "The Git repository URL used for this build"
      name: CHAINS-GIT_URL
      value: "$(tasks.clone-repository.results.url)$(tasks.clone-repository-bundle.results.url)"
    - description: "The Git commit SHA used for this build"
      name: CHAINS-GIT_COMMIT
      value: "$(tasks.clone-repository.results.commit)$(tasks.clone-repository-bundle.results.commit)"
  tasks:
    - name: init
      params:
        - name: image-url
          value: $(params.output-image)
        - name: rebuild
          value: $(params.rebuild)
        - name: skip-checks
          value: $(params.skip-checks)
      taskRef:
        params:
          - name: name
            value: init
          - name: bundle
            value: quay.io/konflux-ci/tekton-catalog/task-init:0.2@sha256:ded314206f09712b2116deb050b774ae7efef9ab243794334c8e616871a3ffa5
          - name: kind
            value: task
        resolver: bundles
    # Git clone task for hub and operator (OCI-TA version)
    - name: clone-repository
      params:
        - name: url
          value: $(params.git-url)
        - name: revision
          value: $(params.revision)
        - name: ociStorage
          value: $(params.output-image).git
        - name: ociArtifactExpiresAfter
          value: $(params.image-expires-after)
      runAfter:
        - init
      taskRef:
        params:
          - name: name
            value: git-clone-oci-ta
          - name: bundle
            value: quay.io/konflux-ci/tekton-catalog/task-git-clone-oci-ta:0.1@sha256:4a601aeec58a1dd89c271e728fd8f0d84777825b46940c3aec27f15bab3edacf
          - name: kind
            value: task
        resolver: bundles
      retries: 2
      timeout: 10m
      when:
        - input: $(tasks.init.results.build)
          operator: in
          values: ["true"]
        - input: $(params.component-type)
          operator: in
          values: ["hub", "operator"]
      workspaces:
        - name: basic-auth
          workspace: git-auth
    # Git clone task for operator-bundle (standard version)
    - name: clone-repository-bundle
      params:
        - name: url
          value: $(params.git-url)
        - name: revision
          value: $(params.revision)
      runAfter:
        - init
      taskRef:
        params:
          - name: name
            value: git-clone
          - name: bundle
            value: quay.io/konflux-ci/tekton-catalog/task-git-clone:0.1@sha256:7939000e2f92fc8b5d2c4ee4ba9000433c5aa7700d2915a1d4763853d5fd1fd4
          - name: kind
            value: task
        resolver: bundles
      when:
        - input: $(tasks.init.results.build)
          operator: in
          values: ["true"]
        - input: $(params.component-type)
          operator: in
          values: ["operator-bundle"]
      workspaces:
        - name: output
          workspace: workspace
        - name: basic-auth
          workspace: git-auth
    # Prefetch dependencies task for hub and operator (OCI-TA version)
    - name: prefetch-dependencies
      params:
        - name: config-file-content
          value: |
            ---
            requests_timeout: 600000
            subprocess_timeout: 7200
        - name: log-level
          value: debug
        - name: input
          value: $(params.prefetch-input)
        - name: SOURCE_ARTIFACT
          value: $(tasks.clone-repository.results.SOURCE_ARTIFACT)
        - name: ociStorage
          value: $(params.output-image).prefetch
        - name: ociArtifactExpiresAfter
          value: $(params.image-expires-after)
        - name: dev-package-managers
          value: "true"
        - name: SBOM_TYPE
          value: spdx
      runAfter:
        - clone-repository
      taskRef:
        params:
          - name: name
            value: prefetch-dependencies-oci-ta
          - name: bundle
            value: quay.io/konflux-ci/tekton-catalog/task-prefetch-dependencies-oci-ta:0.2@sha256:981dbd9ddecdbb716f321e65e645c6f74886352098d50d958f1195da550fac73
          - name: kind
            value: task
        resolver: bundles
      when:
        - input: $(params.prefetch-input)
          operator: notin
          values: [""]
        - input: $(tasks.init.results.build)
          operator: in
          values: ["true"]
        - input: $(params.component-type)
          operator: in
          values: ["hub", "operator"]
      workspaces:
        - name: git-basic-auth
          workspace: git-auth
        - name: netrc
          workspace: netrc
    # Prefetch dependencies task for operator-bundle (standard version)
    - name: prefetch-dependencies-bundle
      params:
        - name: input
          value: $(params.prefetch-input)
      runAfter:
        - clone-repository
      taskRef:
        params:
          - name: name
            value: prefetch-dependencies
          - name: bundle
            value: quay.io/konflux-ci/tekton-catalog/task-prefetch-dependencies:0.2@sha256:c76e356fe3bb6f828b44ba4d09850f66116ebc4be1f26244880a96cfe6aee546
          - name: kind
            value: task
        resolver: bundles
      when:
        - input: $(params.prefetch-input)
          operator: notin
          values: [""]
        - input: $(tasks.init.results.build)
          operator: in
          values: ["true"]
        - input: $(params.component-type)
          operator: in
          values: ["operator-bundle"]
      workspaces:
        - name: source
          workspace: workspace
        - name: git-basic-auth
          workspace: git-auth
        - name: netrc
          workspace: netrc
    # Sealights instrumentation for hub component
    - name: sealights-instrumentation
      params:
        - name: SOURCE_ARTIFACT
          value: $(tasks.clone-repository.results.SOURCE_ARTIFACT)
        - name: component
          value: 'rhdh-hub-rhel9'
        - name: branch
          value: $(params.source-branch)
        - name: revision
          value: $(params.revision)
        - name: repository-url
          value: $(params.git-url)
        - name: test-event
          value: "push"  # Will be overridden by PipelineRun context
        - name: target-branch
          value: $(params.target_branch)
        - name: workspace-path
          value: "distgit/containers/rhdh-hub"
        - name: is-frontend
          value: "true"
      runAfter:
        - clone-repository
      taskRef:
        params:
          - name: name
            value: sealights-nodejs-oci-ta
          - name: bundle
            value: quay.io/konflux-ci/tekton-catalog/task-sealights-nodejs-oci-ta:0.1@sha256:1969e1547b0bdb90c57f12fb8f0c74db76246cd0bf9a29c0776b8fdd14a58298
          - name: kind
            value: task
        resolver: bundles
      when:
        - input: $(params.component-type)
          operator: in
          values: ["hub"]
        - input: $(tasks.init.results.build)
          operator: in
          values: ["true"]
    # Sealights Go instrumentation for operator component
    - name: sealights-go-instrumentation
      params:
        - name: SOURCE_ARTIFACT
          value: $(tasks.clone-repository.results.SOURCE_ARTIFACT)
        - name: component
          value: 'rhdh-operator-downstream'
        - name: branch
          value: $(params.source-branch)
        - name: revision
          value: $(params.revision)
        - name: oci-storage
          value: $(params.sealights-output-image).sealights.git
        - name: workspace-path
          value: $(params.path-context)
      runAfter:
        - prefetch-dependencies
      taskRef:
        params:
          - name: name
            value: sealights-go-oci-ta
          - name: bundle
            value: quay.io/konflux-ci/tekton-catalog/task-sealights-go-oci-ta:0.1@sha256:ce75fd9d498365a9c1e42f8340cc3e7d09a68ab312588905d169964055f092b2
          - name: kind
            value: task
        resolver: bundles
      when:
        - input: $(params.component-type)
          operator: in
          values: ["operator"]
        - input: $(tasks.init.results.build)
          operator: in
          values: ["true"]
    # Main build container task for hub and operator
    - name: build-container
      params:
        - name: IMAGE
          value: $(params.output-image)
        - name: DOCKERFILE
          value: $(params.dockerfile)
        - name: CONTEXT
          value: $(params.path-context)
        - name: HERMETIC
          value: $(params.hermetic)
        - name: PREFETCH_INPUT
          value: $(params.prefetch-input)
        - name: IMAGE_EXPIRES_AFTER
          value: $(params.image-expires-after)
        - name: COMMIT_SHA
          value: $(tasks.clone-repository.results.commit)
        - name: BUILD_ARGS
          value:
            - $(params.build-args[*])
        - name: BUILD_ARGS_FILE
          value: $(params.build-args-file)
        - name: SOURCE_ARTIFACT
          value: $(tasks.prefetch-dependencies.results.SOURCE_ARTIFACT)
        - name: CACHI2_ARTIFACT
          value: $(tasks.prefetch-dependencies.results.CACHI2_ARTIFACT)
        - name: SBOM_TYPE
          value: spdx
      runAfter:
        - prefetch-dependencies
      taskRef:
        params:
          - name: name
            value: buildah-oci-ta
          - name: bundle
            value: quay.io/konflux-ci/tekton-catalog/task-buildah-oci-ta:0.4@sha256:db496b9f7072fb9d1c4b749db6bab8c19c0b647a8a4d2589833dcec979876657
          - name: kind
            value: task
        resolver: bundles
      retries: 1
      timeout: 2h
      when:
        - input: $(tasks.init.results.build)
          operator: in
          values: ["true"]
        - input: $(params.component-type)
          operator: in
          values: ["hub", "operator"]
      workspaces:
        - name: source
          workspace: workspace
    # Main build container task for operator-bundle
    - name: build-container-bundle
      params:
        - name: IMAGE
          value: $(params.output-image)
        - name: DOCKERFILE
          value: $(params.dockerfile)
        - name: CONTEXT
          value: $(params.path-context)
        - name: HERMETIC
          value: $(params.hermetic)
        - name: PREFETCH_INPUT
          value: $(params.prefetch-input)
        - name: IMAGE_EXPIRES_AFTER
          value: $(params.image-expires-after)
        - name: COMMIT_SHA
          value: $(tasks.clone-repository-bundle.results.commit)
        - name: BUILD_ARGS
          value:
            - $(params.build-args[*])
        - name: BUILD_ARGS_FILE
          value: $(params.build-args-file)
      runAfter:
        - prefetch-dependencies-bundle
      taskRef:
        params:
          - name: name
            value: buildah
          - name: bundle
            value: quay.io/konflux-ci/tekton-catalog/task-buildah:0.4@sha256:21d842604d5fda0b0f131c6d84395091f15bc79cca55132ab03b87b0e40842a6
          - name: kind
            value: task
        resolver: bundles
      when:
        - input: $(tasks.init.results.build)
          operator: in
          values: ["true"]
        - input: $(params.component-type)
          operator: in
          values: ["operator-bundle"]
      workspaces:
        - name: source
          workspace: workspace
    # Sealights build container task for hub
    - name: build-container-sealights-hub
      params:
        - name: SKIP_SBOM_GENERATION
          value: "true"
        - name: ADDITIONAL_SECRET
          value: sealights-credentials
        - name: IMAGE
          value: $(params.sealights-output-image)
        - name: DOCKERFILE
          value: $(params.sealights-dockerfile)
        - name: CONTEXT
          value: $(params.path-context)
        - name: HERMETIC
          value: "false"
        - name: PREFETCH_INPUT
          value: $(params.prefetch-input)
        - name: IMAGE_EXPIRES_AFTER
          value: $(params.sealights-image-expires-after)
        - name: COMMIT_SHA
          value: $(tasks.clone-repository.results.commit)
        - name: BUILD_ARGS
          value:
            - $(params.build-args[*])
            - "BSID=$(tasks.sealights-instrumentation.results.sealights-bsid)"
            - "AGENT_VERSION=$(tasks.sealights-instrumentation.results.sealights-agent-version)"
            - "PRISTINE_IMAGE=$(tasks.build-container.results.IMAGE_URL)"
        - name: BUILD_ARGS_FILE
          value: $(params.build-args-file)
        - name: SOURCE_ARTIFACT
          value: $(tasks.prefetch-dependencies.results.SOURCE_ARTIFACT)
        - name: CACHI2_ARTIFACT
          value: $(tasks.prefetch-dependencies.results.CACHI2_ARTIFACT)
        - name: SBOM_TYPE
          value: spdx
      runAfter:
        - build-container
      taskRef:
        params:
          - name: name
            value: buildah-oci-ta
          - name: bundle
            value: quay.io/konflux-ci/tekton-catalog/task-buildah-oci-ta:0.4@sha256:db496b9f7072fb9d1c4b749db6bab8c19c0b647a8a4d2589833dcec979876657
          - name: kind
            value: task
        resolver: bundles
      timeout: 30m
      when:
        - input: $(params.component-type)
          operator: in
          values: ["hub"]
        - input: $(tasks.init.results.build)
          operator: in
          values: ["true"]
      workspaces:
        - name: source
          workspace: workspace
    # Sealights build container task for operator
    - name: build-container-sealights-operator
      params:
        - name: SKIP_SBOM_GENERATION
          value: "true"
        - name: IMAGE
          value: $(params.sealights-output-image)
        - name: DOCKERFILE
          value: $(params.dockerfile)
        - name: CONTEXT
          value: $(params.path-context)
        - name: HERMETIC
          value: $(params.hermetic)
        - name: PREFETCH_INPUT
          value: $(params.prefetch-input)
        - name: IMAGE_EXPIRES_AFTER
          value: $(params.sealights-image-expires-after)
        - name: COMMIT_SHA
          value: $(tasks.clone-repository.results.commit)
        - name: BUILD_ARGS
          value:
            - $(params.build-args[*])
        - name: BUILD_ARGS_FILE
          value: $(params.build-args-file)
        - name: SOURCE_ARTIFACT
          value: $(tasks.sealights-go-instrumentation.results.SOURCE_ARTIFACT)
        - name: CACHI2_ARTIFACT
          value: $(tasks.prefetch-dependencies.results.CACHI2_ARTIFACT)
      runAfter:
        - sealights-go-instrumentation
      taskRef:
        params:
          - name: name
            value: buildah-oci-ta
          - name: bundle
            value: quay.io/konflux-ci/tekton-catalog/task-buildah-oci-ta:0.4@sha256:db496b9f7072fb9d1c4b749db6bab8c19c0b647a8a4d2589833dcec979876657
          - name: kind
            value: task
        resolver: bundles
      when:
        - input: $(params.component-type)
          operator: in
          values: ["operator"]
        - input: $(params.enable-sealights)
          operator: in
          values: ["true"]
        - input: $(params.sealights-output-image)
          operator: notin
          values: [""]
        - input: $(tasks.init.results.build)
          operator: in
          values: ["true"]
    # Sealights build container task for operator-bundle
    - name: build-container-sealights-bundle
      params:
        - name: SKIP_SBOM_GENERATION
          value: "true"
        - name: IMAGE
          value: $(params.sealights-output-image)
        - name: DOCKERFILE
          value: $(params.sealights-dockerfile)
        - name: CONTEXT
          value: $(params.path-context)
        - name: HERMETIC
          value: $(params.hermetic)
        - name: PREFETCH_INPUT
          value: $(params.prefetch-input)
        - name: IMAGE_EXPIRES_AFTER
          value: $(params.sealights-image-expires-after)
        - name: COMMIT_SHA
          value: $(tasks.clone-repository.results.commit)
        - name: BUILD_ARGS
          value:
            - $(params.build-args[*])
        - name: BUILD_ARGS_FILE
          value: $(params.build-args-file)
      runAfter:
        - prefetch-dependencies
      taskRef:
        params:
          - name: name
            value: buildah
          - name: bundle
            value: quay.io/konflux-ci/tekton-catalog/task-buildah:0.4@sha256:21d842604d5fda0b0f131c6d84395091f15bc79cca55132ab03b87b0e40842a6
          - name: kind
            value: task
        resolver: bundles
      when:
        - input: $(params.component-type)
          operator: in
          values: ["operator-bundle"]
        - input: $(params.enable-sealights)
          operator: in
          values: ["true"]
        - input: $(params.sealights-output-image)
          operator: notin
          values: [""]
        - input: $(tasks.init.results.build)
          operator: in
          values: ["true"]
      workspaces:
        - name: source
          workspace: workspace
    # Build image index task for hub and operator
    - name: build-image-index
      params:
        - name: IMAGE
          value: $(params.output-image)
        - name: COMMIT_SHA
          value: $(tasks.clone-repository.results.commit)
        - name: IMAGE_EXPIRES_AFTER
          value: $(params.image-expires-after)
        - name: ALWAYS_BUILD_INDEX
          value: $(params.build-image-index)
        - name: IMAGES
          value:
            - $(tasks.build-container.results.IMAGE_URL)@$(tasks.build-container.results.IMAGE_DIGEST)
      runAfter:
        - build-container
        - build-container-sealights-hub
        - build-container-sealights-operator
      taskRef:
        params:
          - name: name
            value: build-image-index
          - name: bundle
            value: quay.io/konflux-ci/tekton-catalog/task-build-image-index:0.1@sha256:ba7fbed5c4862968c1a77d6b90d5bdd497925ab1de41b859c027dd5c3069cd3e
          - name: kind
            value: task
        resolver: bundles
      when:
        - input: $(tasks.init.results.build)
          operator: in
          values: ["true"]
        - input: $(params.component-type)
          operator: in
          values: ["hub", "operator"]
    # Build image index task for operator-bundle
    - name: build-image-index-bundle
      params:
        - name: IMAGE
          value: $(params.output-image)
        - name: COMMIT_SHA
          value: $(tasks.clone-repository-bundle.results.commit)
        - name: IMAGE_EXPIRES_AFTER
          value: $(params.image-expires-after)
        - name: ALWAYS_BUILD_INDEX
          value: $(params.build-image-index)
        - name: IMAGES
          value:
            - $(tasks.build-container-bundle.results.IMAGE_URL)@$(tasks.build-container-bundle.results.IMAGE_DIGEST)
      runAfter:
        - build-container-bundle
        - build-container-sealights-bundle
      taskRef:
        params:
          - name: name
            value: build-image-index
          - name: bundle
            value: quay.io/konflux-ci/tekton-catalog/task-build-image-index:0.1@sha256:ba7fbed5c4862968c1a77d6b90d5bdd497925ab1de41b859c027dd5c3069cd3e
          - name: kind
            value: task
        resolver: bundles
      when:
        - input: $(tasks.init.results.build)
          operator: in
          values: ["true"]
        - input: $(params.component-type)
          operator: in
          values: ["operator-bundle"]
    # Build image index for sealights bundle
    - name: build-image-index-sealights-bundle
      params:
        - name: IMAGE
          value: $(params.sealights-output-image)
        - name: COMMIT_SHA
          value: $(tasks.clone-repository-bundle.results.commit)
        - name: IMAGE_EXPIRES_AFTER
